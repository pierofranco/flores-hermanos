spring.application.name=Flores Hermanos
server.address=127.0.0.1
server.port=${FLORES_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.datasource.url=${FLORES_DB_URL:jdbc:postgresql://127.0.0.1:5432/flores_hermanos}
spring.datasource.username=${FLORES_DB_USER:flores}
spring.datasource.password=${FLORES_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.time-zone=America/Lima
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.security=INFO
flores.demo=true
flores.seed=true
flores.points-km=10
flores.point-value=0.10
flores.reservation-minutes=5
flores.demo-password=${FLORES_DEMO_PASSWORD:Flores2026!}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=10000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
